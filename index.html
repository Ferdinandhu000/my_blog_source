<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8e5e1" />
    <meta
      name="description"
      content="胡珏的个人博客：三维档案、技术笔记与项目记录。"
    />
    <title>HJ BLOG · 个人博客</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        if (location.pathname === '/' && JSON.parse(localStorage.getItem('hj-blog-settings') || '{}').language === 'en') {
          location.replace('/en/' + location.search + location.hash);
        }
      } catch { /* Storage may be unavailable. */ }
    </script>
  </head>
  <body>
    <main id="viewport"><div id="stage"></div></main>
    <span id="busuanzi_container_site_pv" hidden><span id="busuanzi_value_site_pv"></span></span>
    <span id="busuanzi_container_site_uv" hidden><span id="busuanzi_value_site_uv"></span></span>
    <script type="module" src="/src/main.ts"></script>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  </body>
</html>
