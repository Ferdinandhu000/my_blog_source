[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/post/*"
  to = "/archives/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/downloads/ielts/*"
  [headers.values]
    Content-Disposition = "attachment"
