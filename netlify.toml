[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/en/p/gemini-pixel-certificate/"
  to = "/p/gemini-pixel-certificate/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/post/*"
  to = "/archives/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
