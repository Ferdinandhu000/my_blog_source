name: Build blog

on:
  push:
    branches: [main, codex/rhinelab-blog-rebuild]
    paths-ignore:
      - stats_history.json
  pull_request:
    paths-ignore:
      - stats_history.json

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:content
